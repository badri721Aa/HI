<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alhekma Live</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: rgba(255,255,255,0.03);
      --surface-hover: rgba(255,255,255,0.06);
      --border-top: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.07);
      --border-b: rgba(255,255,255,0.04);
      --text: #e4e4e7;
      --text-2: #a1a1aa;
      --muted: #71717a;
      --dim: #3f3f46;
      --green: #22c55e;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --violet: #8b5cf6;
      --inset: inset 0 1px 0 0 rgba(255,255,255,0.07);
      --shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }

    body {
      width: 360px;
      min-height: 460px;
      max-height: 580px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
      flex-shrink: 0;
    }
    .logo-row { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #6d28d9 0%, #4338ca 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: white; letter-spacing: -0.5px;
      box-shadow: var(--inset), 0 2px 8px rgba(109,40,217,0.4);
    }
    .header-title { font-weight: 600; font-size: 13px; color: var(--text); letter-spacing: -0.2px; }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: ping-dot 2.5s ease-in-out infinite;
    }
    @keyframes ping-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
    }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-sm {
      font-size: 10px; color: var(--muted);
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
      box-shadow: var(--inset);
    }
    .btn-sm:hover { color: var(--text); background: var(--surface-hover); border-color: rgba(255,255,255,0.12); }
    .btn-sm:active { transform: scale(0.97); }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 8px 10px 0;
      gap: 2px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-b);
      padding-bottom: 8px;
      background: rgba(255,255,255,0.01);
    }
    .tab {
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 11px; font-weight: 500;
      color: var(--muted);
      background: none; border: none; cursor: pointer;
      transition: color 0.12s, background 0.12s;
      position: relative;
    }
    .tab.active {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--inset);
    }
    .tab:not(.active):hover { color: var(--text-2); background: rgba(255,255,255,0.03); }
    .tab-badge {
      position: absolute; top: 3px; right: 3px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--rose);
    }

    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 12px 14px; }

    /* Section label */
    .section-label {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 8px; font-weight: 500;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* Online users */
    .user-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.025);
    }
    .user-row:last-child { border-bottom: none; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: var(--green); box-shadow: 0 0 4px rgba(34,197,94,0.5); }
    .user-name { color: var(--text); font-size: 12px; flex: 1; }
    .user-badge {
      font-size: 9px; font-family: monospace;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 1px 5px; color: var(--muted);
    }
    .user-badge.owner { border-color: rgba(245,158,11,0.3); color: var(--amber); }

    /* Messages */
    .msg-card {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--surface);
      border-top: 1px solid var(--border-top);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border-b);
      border-bottom: 1px solid var(--border-b);
      margin-bottom: 6px;
      box-shadow: var(--inset), var(--shadow);
    }
    .msg-meta { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; }
    .msg-author { font-weight: 600; font-size: 11px; color: var(--text-2); }
    .msg-time { font-size: 9px; color: var(--dim); font-family: monospace; }
    .msg-body { font-size: 12px; color: var(--text); line-height: 1.45; word-break: break-word; }

    /* News */
    .news-card {
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--surface);
      border-top: 1px solid var(--border-top);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border-b);
      border-bottom: 1px solid var(--border-b);
      margin-bottom: 6px;
      box-shadow: var(--inset);
    }
    .news-card.pinned {
      border-top-color: rgba(245,158,11,0.3);
      border-left-color: rgba(245,158,11,0.15);
    }
    .news-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .pin-badge {
      font-size: 9px; color: var(--amber);
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 4px; padding: 1px 5px;
      font-family: monospace;
    }
    .news-time { font-size: 9px; color: var(--dim); font-family: monospace; }
    .news-body { font-size: 12px; color: var(--text); line-height: 1.45; }

    /* Admin panel */
    .admin-panel { space-y: 12px; }
    .admin-section { margin-bottom: 16px; }
    .admin-section .section-label { margin-bottom: 6px; }
    .broadcast-input {
      width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border-top);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border-b);
      border-bottom: 1px solid var(--border-b);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text);
      resize: none;
      height: 60px;
      outline: none;
      transition: border-color 0.12s;
      box-shadow: var(--inset);
    }
    .broadcast-input:focus { border-top-color: rgba(255,255,255,0.2); }
    .broadcast-input::placeholder { color: var(--dim); }
    .btn-primary {
      width: 100%; margin-top: 6px;
      padding: 7px;
      background: #e4e4e7;
      color: #18181b;
      font-size: 11px; font-weight: 600;
      border: none; border-radius: 7px;
      cursor: pointer;
      transition: background 0.12s, transform 0.1s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .btn-primary:hover { background: #fff; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-toggle {
      display: flex; gap: 6px;
    }
    .status-opt {
      flex: 1; padding: 6px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 11px; font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.12s;
      box-shadow: var(--inset);
    }
    .status-opt.active-green { border-color: rgba(34,197,94,0.3); color: var(--green); background: rgba(34,197,94,0.06); }
    .status-opt.active-amber { border-color: rgba(245,158,11,0.3); color: var(--amber); background: rgba(245,158,11,0.06); }
    .status-opt:hover { color: var(--text); }
    .feedback { font-size: 11px; color: var(--green); margin-top: 5px; }
    .feedback.error { color: var(--rose); }

    /* Empty / loading */
    .empty { text-align: center; padding: 28px 0; color: var(--dim); font-size: 11px; line-height: 1.6; }
    .loading { text-align: center; padding: 32px 0; color: var(--dim); font-size: 11px; }

    /* Status bar */
    .status-bar {
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      background: rgba(255,255,255,0.01);
    }
    .status-text { font-size: 10px; color: var(--dim); font-family: monospace; }
    .refresh-btn {
      font-size: 10px; color: var(--muted); background: none; border: none;
      cursor: pointer; transition: color 0.12s;
      padding: 2px 6px; border-radius: 5px;
    }
    .refresh-btn:hover { color: var(--text); background: var(--surface); }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-row">
      <div class="logo">AL</div>
      <span class="header-title">Alhekma Live</span>
      <div class="live-dot" id="live-dot" style="display:none"></div>
    </div>
    <div class="header-actions">
      <button class="btn-sm" id="open-site">Open ↗</button>
    </div>
  </div>

  <div class="tabs" id="tab-bar">
    <button class="tab active" data-tab="online">Online</button>
    <button class="tab" data-tab="messages">
      Messages
      <span class="tab-badge" id="unread-dot" style="display:none"></span>
    </button>
    <button class="tab" data-tab="news">News</button>
    <button class="tab" data-tab="admin" id="admin-tab" style="display:none">Admin</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading…</div>
  </div>

  <div class="status-bar">
    <span class="status-text" id="status-text">—</span>
    <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

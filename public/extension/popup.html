<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alhekma Live</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: rgba(255,255,255,0.07);
      --text: #e4e4e7;
      --muted: #71717a;
      --dim: #3f3f46;
      --accent: #a1a1aa;
      --green: #22c55e;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --violet: #8b5cf6;
    }

    body {
      width: 340px;
      min-height: 400px;
      max-height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: white;
    }
    .header-title { font-weight: 600; font-size: 13px; color: var(--text); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .open-btn {
      font-size: 10px; color: var(--muted);
      text-decoration: none;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: color 0.15s, border-color 0.15s;
      cursor: pointer; background: none;
    }
    .open-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 8px 12px 0;
      gap: 2px;
      flex-shrink: 0;
    }
    .tab {
      padding: 5px 10px; border-radius: 7px;
      font-size: 11px; font-weight: 500;
      color: var(--muted); background: none; border: none; cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .tab.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .tab:not(.active):hover { color: var(--accent); }

    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 12px 16px; }

    /* Online list */
    .section-label {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 8px; font-weight: 500;
    }
    .user-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .user-row:last-child { border-bottom: none; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.online { background: var(--green); }
    .dot.offline { background: var(--dim); }
    .user-name { color: var(--text); font-size: 12px; }

    /* Messages */
    .msg-row {
      padding: 8px 10px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .msg-meta { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .msg-author { font-weight: 600; font-size: 11px; color: var(--accent); }
    .msg-time { font-size: 10px; color: var(--dim); }
    .msg-body { font-size: 12px; color: var(--text); line-height: 1.45; word-break: break-word; }

    /* News */
    .news-row {
      padding: 8px 10px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .news-row.pinned { border-color: rgba(245, 158, 11, 0.25); }
    .news-meta { display: flex; align-items: center; gap-4px; margin-bottom: 3px; gap: 6px; }
    .pin-badge {
      font-size: 9px; color: var(--amber); background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2); border-radius: 4px; padding: 1px 5px;
    }
    .news-time { font-size: 10px; color: var(--dim); }
    .news-body { font-size: 12px; color: var(--text); line-height: 1.45; }

    /* Auth panel */
    .auth-panel { text-align: center; padding: 32px 16px; }
    .auth-icon { font-size: 32px; margin-bottom: 12px; }
    .auth-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .auth-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .auth-btn {
      display: inline-block; padding: 8px 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 12px;
      text-decoration: none; cursor: pointer;
      transition: background 0.15s;
    }
    .auth-btn:hover { background: #27272a; }

    /* Empty state */
    .empty { text-align: center; padding: 24px 0; color: var(--dim); font-size: 11px; }

    /* Status bar */
    .status-bar {
      padding: 6px 16px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .status-text { font-size: 10px; color: var(--dim); }
    .refresh-btn {
      font-size: 10px; color: var(--muted); background: none; border: none;
      cursor: pointer; transition: color 0.15s;
    }
    .refresh-btn:hover { color: var(--text); }

    .loading { text-align: center; padding: 32px 0; color: var(--dim); font-size: 11px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">A</div>
      <span class="header-title">Alhekma Live</span>
    </div>
    <div class="header-right">
      <button class="open-btn" id="open-site">Open Site ↗</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="online">Online</button>
    <button class="tab" data-tab="messages">Messages</button>
    <button class="tab" data-tab="news">News</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading...</div>
  </div>

  <div class="status-bar">
    <span class="status-text" id="status-text">—</span>
    <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

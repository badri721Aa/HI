name: Store CI

# The storefront lives in store/ (its own package and lockfile); the rest of
# the repository is a separate app, so this only runs when store/ changes.
on:
  push:
    paths:
      - "store/**"
      - ".github/workflows/store-ci.yml"
  pull_request:
    paths:
      - "store/**"
      - ".github/workflows/store-ci.yml"

concurrency:
  group: store-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: store

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Typecheck, lint, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PageProps / LayoutProps and next-env.d.ts are generated by Next, not committed.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: store/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('store/package-lock.json') }}-${{ hashFiles('store/app/**', 'store/components/**', 'store/content/**', 'store/lib/**', 'store/types/**', 'store/public/**', 'store/*.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('store/package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # Always run: --with-deps installs the system libraries even when the browser is cached.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            store/playwright-report/
            store/test-results/
          if-no-files-found: ignore
          retention-days: 14

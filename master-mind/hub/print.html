<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Mind · Print</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <style>
    @font-face { font-family: "Inter MM"; src: url("../vendor/fonts/inter-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: "Inter MM"; src: url("../vendor/fonts/inter-latin-wght-italic.woff2") format("woff2-variations"); font-weight: 100 900; font-style: italic; font-display: block; }
    @font-face { font-family: "JetBrains Mono MM"; src: url("../vendor/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 100 800; font-display: block; }
    :root { color-scheme: light; --ink: #14161c; --ink-2: #3d4250; --muted: #6b7180; --line: #e3e5ea; --soft: #f5f6f8; --accent: #0e7490; --violet: #6d28d9; }
    * { box-sizing: border-box; }
    html { background: #eceef2; }
    body { margin: 0; color: var(--ink); font: 15px/1.65 "Inter MM", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

    .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: rgba(11, 12, 16, .92); color: #eceff7; backdrop-filter: blur(12px); font-size: 13px; }
    .bar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-right: auto; }
    .bar img { width: 22px; height: 22px; border-radius: 6px; }
    .bar .state { color: #b6bccc; }
    .bar button { font: 600 13px/1 "Inter MM", Inter, ui-sans-serif, system-ui, sans-serif; padding: 8px 12px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .06); color: #eceff7; cursor: pointer; }
    .bar button.primary { background: linear-gradient(135deg, #22d3ee, #a78bfa); color: #06080d; border-color: transparent; }
    .bar button:disabled { opacity: .45; cursor: default; }
    .bar button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }

    .sheet { max-width: 800px; margin: 28px auto 60px; padding: 56px 64px; background: #fff; border-radius: 6px; box-shadow: 0 10px 40px rgba(16, 20, 32, .12); }
    .doc-head { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 26px; }
    .kicker { font: 700 11px/1 "Inter MM", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
    h1.title { font-size: 30px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 12px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12.5px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tags span { font: 600 11.5px/1 "Inter MM", sans-serif; padding: 4px 9px; border-radius: 99px; color: var(--violet); background: #f3efff; border: 1px solid #ddd3fb; }

    .md { overflow-wrap: anywhere; }
    .md > :first-child { margin-top: 0; }
    .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; letter-spacing: -.01em; margin: 1.5em 0 .5em; break-after: avoid; page-break-after: avoid; }
    .md h1 { font-size: 24px; } .md h2 { font-size: 20px; } .md h3 { font-size: 17px; } .md h4 { font-size: 15px; }
    .md p, .md ul, .md ol, .md blockquote, .md pre, .md table, .md .math-block { margin: 0 0 .9em; }
    .md ul, .md ol { padding-left: 1.4em; }
    .md li { margin: .2em 0; }
    .md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; }
    .md input[type="checkbox"] { margin: 0 .5em 0 0; vertical-align: -1px; accent-color: var(--accent); }
    .md a { color: var(--accent); text-decoration: underline; text-decoration-color: #9fd5e3; text-underline-offset: 2px; }
    .md .wiki { color: var(--violet); font-weight: 600; border-bottom: 1px dashed #c4b5fd; }
    .md strong { color: #000; }
    .md blockquote { padding: .2em 1em; border-left: 3px solid var(--accent); color: var(--ink-2); background: #f6fbfc; break-inside: avoid; page-break-inside: avoid; }
    .md code { font: 13px/1.5 "JetBrains Mono MM", ui-monospace, SFMono-Regular, Consolas, monospace; padding: 1px 5px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); }
    .md pre { padding: 12px 14px; border-radius: 8px; background: #f6f8fa; border: 1px solid var(--line); white-space: pre-wrap; break-inside: avoid; page-break-inside: avoid; }
    .md pre code { padding: 0; border: 0; background: none; font-size: 12.5px; }
    .md table { border-collapse: collapse; width: 100%; font-size: 13.5px; break-inside: avoid; }
    .md th, .md td { border: 1px solid #d5d8de; padding: 6px 9px; text-align: left; vertical-align: top; }
    .md th { background: var(--soft); }
    .md hr { border: 0; height: 1px; background: var(--line); margin: 1.6em 0; }
    .md img { max-width: 100%; height: auto; border-radius: 6px; break-inside: avoid; }
    .md .math-block { overflow-x: auto; }
    .md .katex { font-size: 1.08em; }

    /* highlight.js, light (GitHub) */
    .hljs { color: #24292e; background: transparent; }
    .hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-template-tag, .hljs-template-variable, .hljs-type, .hljs-variable.language_ { color: #d73a49; }
    .hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-title.function_ { color: #6f42c1; }
    .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-meta, .hljs-number, .hljs-operator, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-variable { color: #005cc5; }
    .hljs-meta .hljs-string, .hljs-regexp, .hljs-string { color: #032f62; }
    .hljs-built_in, .hljs-symbol { color: #e36209; }
    .hljs-code, .hljs-comment, .hljs-formula { color: #6a737d; }
    .hljs-name, .hljs-quote, .hljs-selector-pseudo, .hljs-selector-tag { color: #22863a; }
    .hljs-subst { color: #24292e; }
    .hljs-section { color: #005cc5; font-weight: 700; }
    .hljs-bullet { color: #735c0f; }
    .hljs-emphasis { font-style: italic; }
    .hljs-strong { font-weight: 700; }
    .hljs-addition { color: #22863a; background: #f0fff4; }
    .hljs-deletion { color: #b31d28; background: #ffeef0; }

    .sources { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line); break-inside: avoid; }
    .sources h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    .sources ol { margin: 0; padding-left: 1.3em; font-size: 13px; color: var(--ink-2); }
    .sources li { margin: .25em 0; }
    .sources .u { color: var(--muted); word-break: break-all; }
    .foot { margin-top: 30px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
    .problem { text-align: center; color: var(--ink-2); padding: 40px 0; }
    .problem b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 6px; }

    @page { margin: 18mm 16mm; }
    @media print {
      html, body { background: #fff; }
      .bar { display: none; }
      .sheet { max-width: none; margin: 0; padding: 0; box-shadow: none; border-radius: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media (max-width: 760px) { .sheet { margin: 0; padding: 28px 20px; border-radius: 0; } }
  </style>
</head>
<body>
  <div class="bar" role="toolbar" aria-label="Print controls">
    <span class="brand"><img src="../icons/logo.svg" alt="">Master Mind</span>
    <span id="state" class="state" role="status">Preparing your note…</span>
    <button id="printBtn" class="primary" type="button" disabled>Print / Save as PDF</button>
    <button id="closeBtn" type="button">Close</button>
  </div>
  <main class="sheet" id="sheet" aria-busy="true"></main>
  <script type="module" src="print.js"></script>
</body>
</html>

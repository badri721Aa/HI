<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Mind</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <link rel="stylesheet" href="../vendor/hljs-dark.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="mm-page mm-root">
  <header class="top">
    <img class="logo" src="../icons/logo.svg" alt="">
    <div class="page-meta">
      <b id="pageTitle">Master Mind</b>
      <span id="pageSite" class="mm-muted mm-small">Open a web page to begin</span>
    </div>
    <button id="refreshBtn" class="mm-btn ghost icon" title="Re-read this page" aria-label="Re-read this page">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4"/></svg>
    </button>
    <button id="hubBtn" class="mm-btn ghost icon" title="Open Knowledge Hub" aria-label="Open Knowledge Hub">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.2l7.6-.2M7.2 8.2l3.8 7.6M16.9 9.2l-3.6 6.8"/></svg>
    </button>
    <button id="settingsBtn" class="mm-btn ghost icon" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </header>

  <nav class="mm-tabs tabbar" role="tablist" aria-label="Master Mind sections">
    <button class="mm-tab" role="tab" id="tab-brief" aria-controls="panel-brief" aria-selected="true" data-tab="brief">Brief</button>
    <button class="mm-tab" role="tab" id="tab-ask" aria-controls="panel-ask" aria-selected="false" data-tab="ask" tabindex="-1">Ask</button>
    <button class="mm-tab" role="tab" id="tab-analyze" aria-controls="panel-analyze" aria-selected="false" data-tab="analyze" tabindex="-1">Analyze</button>
    <button class="mm-tab" role="tab" id="tab-notes" aria-controls="panel-notes" aria-selected="false" data-tab="notes" tabindex="-1">Notes</button>
    <button class="mm-tab" role="tab" id="tab-tools" aria-controls="panel-tools" aria-selected="false" data-tab="tools" tabindex="-1">Tools</button>
  </nav>

  <main id="panels">
    <section class="panel" role="tabpanel" id="panel-brief" aria-labelledby="tab-brief"></section>
    <section class="panel" role="tabpanel" id="panel-ask" aria-labelledby="tab-ask" hidden></section>
    <section class="panel" role="tabpanel" id="panel-analyze" aria-labelledby="tab-analyze" hidden></section>
    <section class="panel" role="tabpanel" id="panel-notes" aria-labelledby="tab-notes" hidden></section>
    <section class="panel" role="tabpanel" id="panel-tools" aria-labelledby="tab-tools" hidden></section>
  </main>

  <div id="noKey" class="nokey" hidden>
    <span>Add your Claude API key to turn on AI features.</span>
    <button id="noKeyBtn" class="mm-btn primary sm">Add key</button>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
